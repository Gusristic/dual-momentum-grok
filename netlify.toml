[build]
  command = "pnpm build"
  publish = "apps/web/.next"
  base = "apps/web"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Sync functions timeout
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.isin-validate]
  timeout = 26

# Background Function (hasta 15 min)
[functions."backtest-process-background"]
  # timeout no configurable más allá de 15 min
